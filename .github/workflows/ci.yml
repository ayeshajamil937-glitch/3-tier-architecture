
name: Docker 3-Tier CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check repository files
        run: ls -la

      - name: Check Docker Compose
        run: docker compose config
        env:
          DB_PASSWORD: test_password
